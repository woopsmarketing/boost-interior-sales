<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:24px;font-family:var(--font-sans);background:var(--surface-page);color:var(--text-strong);-webkit-font-smoothing:antialiased}.row{display:flex;gap:10px}.sw{flex:1;min-width:0}.chip{height:64px;border-radius:10px;box-shadow:var(--shadow-hairline)}.l{font-size:12px;font-weight:600;margin-top:8px}.v{font:11px var(--font-mono);color:var(--text-subtle)}</style></head><body><div class="row"><div class="sw" style="text-align:center"><div style="height:64px;background:#fff;border:1px solid var(--border-subtle);border-radius:var(--radius-xs)"></div><div class="l">xs</div><div class="v">6</div></div><div class="sw" style="text-align:center"><div style="height:64px;background:#fff;border:1px solid var(--border-subtle);border-radius:var(--radius-sm)"></div><div class="l">sm</div><div class="v">8</div></div><div class="sw" style="text-align:center"><div style="height:64px;background:#fff;border:1px solid var(--border-subtle);border-radius:var(--radius-md)"></div><div class="l">md</div><div class="v">12</div></div><div class="sw" style="text-align:center"><div style="height:64px;background:#fff;border:1px solid var(--border-subtle);border-radius:var(--radius-lg)"></div><div class="l">lg</div><div class="v">16</div></div><div class="sw" style="text-align:center"><div style="height:64px;background:#fff;border:1px solid var(--border-subtle);border-radius:var(--radius-xl)"></div><div class="l">xl</div><div class="v">20</div></div><div class="sw" style="text-align:center"><div style="height:64px;background:#fff;border:1px solid var(--border-subtle);border-radius:var(--radius-2xl)"></div><div class="l">2xl</div><div class="v">28</div></div><div class="sw" style="text-align:center"><div style="height:64px;background:#fff;border:1px solid var(--border-subtle);border-radius:var(--radius-device)"></div><div class="l">device</div><div class="v">44</div></div><div class="sw" style="text-align:center"><div style="height:64px;background:#fff;border:1px solid var(--border-subtle);border-radius:var(--radius-pill)"></div><div class="l">pill</div><div class="v">999</div></div></div></body></html>
