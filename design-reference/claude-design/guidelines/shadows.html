<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:24px;font-family:var(--font-sans);background:var(--surface-page);color:var(--text-strong);-webkit-font-smoothing:antialiased}.row{display:flex;gap:10px}.sw{flex:1;min-width:0}.chip{height:64px;border-radius:10px;box-shadow:var(--shadow-hairline)}.l{font-size:12px;font-weight:600;margin-top:8px}.v{font:11px var(--font-mono);color:var(--text-subtle)}</style></head><body><div class="row" style="gap:22px;padding:6px 4px 20px"><div class="sw" style="text-align:center"><div style="height:80px;background:#fff;border-radius:12px;box-shadow:var(--shadow-hairline)"></div><div class="l">hairline</div></div><div class="sw" style="text-align:center"><div style="height:80px;background:#fff;border-radius:12px;box-shadow:var(--shadow-sm)"></div><div class="l">sm</div></div><div class="sw" style="text-align:center"><div style="height:80px;background:#fff;border-radius:12px;box-shadow:var(--shadow-md)"></div><div class="l">md</div></div><div class="sw" style="text-align:center"><div style="height:80px;background:#fff;border-radius:12px;box-shadow:var(--shadow-window)"></div><div class="l">window</div></div><div class="sw" style="text-align:center"><div style="height:80px;background:#fff;border-radius:12px;box-shadow:var(--shadow-float)"></div><div class="l">float</div></div><div class="sw" style="text-align:center"><div style="height:80px;background:#fff;border-radius:12px;box-shadow:var(--shadow-device)"></div><div class="l">device</div></div></div></body></html>
