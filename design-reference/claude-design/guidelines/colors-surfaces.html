<!-- @dsCard group="Colors" viewport="700x150" name="Surfaces" subtitle="Semantic surface aliases" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:24px;font-family:var(--font-sans);background:var(--surface-page);color:var(--text-strong);-webkit-font-smoothing:antialiased}.row{display:flex;gap:10px}.sw{flex:1;min-width:0}.chip{height:64px;border-radius:10px;box-shadow:var(--shadow-hairline)}.l{font-size:12px;font-weight:600;margin-top:8px}.v{font:11px var(--font-mono);color:var(--text-subtle)}</style></head><body><div class="row"><div class="sw"><div class="chip" style="background:var(--surface-page)"></div><div class="l">surface-page</div><div class="v">gray-50</div></div><div class="sw"><div class="chip" style="background:var(--surface-raised)"></div><div class="l">surface-raised</div><div class="v">white</div></div><div class="sw"><div class="chip" style="background:var(--surface-sunken)"></div><div class="l">surface-sunken</div><div class="v">gray-25</div></div><div class="sw"><div class="chip" style="background:var(--surface-bubble)"></div><div class="l">surface-bubble</div><div class="v">gray-100</div></div><div class="sw"><div class="chip" style="background:var(--surface-accent-soft)"></div><div class="l">surface-accent-soft</div><div class="v">blue-50</div></div><div class="sw"><div class="chip" style="background:var(--surface-paper)"></div><div class="l">surface-paper</div><div class="v">warm-50</div></div><div class="sw"><div class="chip" style="background:var(--surface-inverse)"></div><div class="l">surface-inverse</div><div class="v">gray-900</div></div></div></body></html>
