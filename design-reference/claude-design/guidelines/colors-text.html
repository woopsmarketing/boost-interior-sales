<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:24px;font-family:var(--font-sans);background:var(--surface-page);color:var(--text-strong);-webkit-font-smoothing:antialiased}.row{display:flex;gap:10px}.sw{flex:1;min-width:0}.chip{height:64px;border-radius:10px;box-shadow:var(--shadow-hairline)}.l{font-size:12px;font-weight:600;margin-top:8px}.v{font:11px var(--font-mono);color:var(--text-subtle)}</style></head><body><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:14px"><div style=""><div style="font-size:17px;font-weight:600;color:var(--text-strong)">헤드라인</div><div class="v" style="">text-strong</div></div><div style=""><div style="font-size:17px;font-weight:600;color:var(--text-body)">본문</div><div class="v" style="">text-body</div></div><div style=""><div style="font-size:17px;font-weight:600;color:var(--text-muted)">서브 카피</div><div class="v" style="">text-muted</div></div><div style=""><div style="font-size:17px;font-weight:600;color:var(--text-subtle)">메타 정보</div><div class="v" style="">text-subtle</div></div><div style=""><div style="font-size:17px;font-weight:600;color:var(--text-faint)">메시지를 입력하세요…</div><div class="v" style="">text-faint</div></div><div style=""><div style="font-size:17px;font-weight:600;color:var(--text-accent)">BoostChat</div><div class="v" style="">text-accent</div></div><div style=""><div style="font-size:17px;font-weight:600;color:var(--text-link)">사례 자세히 보기 →</div><div class="v" style="">text-link</div></div><div style="background:var(--gray-700);padding:6px 8px;border-radius:8px"><div style="font-size:17px;font-weight:600;color:var(--text-inverse)">상담 문의</div><div class="v" style="color:#fff">text-inverse</div></div></div></body></html>
