<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:24px;font-family:var(--font-sans);background:var(--surface-page);color:var(--text-strong);-webkit-font-smoothing:antialiased}.row{display:flex;gap:10px}.sw{flex:1;min-width:0}.chip{height:64px;border-radius:10px;box-shadow:var(--shadow-hairline)}.l{font-size:12px;font-weight:600;margin-top:8px}.v{font:11px var(--font-mono);color:var(--text-subtle)}</style></head><body><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:14px"><div style="background:#fff;border-radius:12px;padding:14px;box-shadow:var(--shadow-sm)"><div class="l" style="margin:0">ease-out</div><div class="v">cubic-bezier(.22,.61,.36,1)</div><div style="font-size:12px;color:var(--text-muted);margin-top:6px">reveals, cards</div></div><div style="background:#fff;border-radius:12px;padding:14px;box-shadow:var(--shadow-sm)"><div class="l" style="margin:0">ease-inout</div><div class="v">cubic-bezier(.65,0,.35,1)</div><div style="font-size:12px;color:var(--text-muted);margin-top:6px">scroll-scrub</div></div><div style="background:#fff;border-radius:12px;padding:14px;box-shadow:var(--shadow-sm)"><div class="l" style="margin:0">ease-spring-soft</div><div class="v">cubic-bezier(.2,.8,.2,1)</div><div style="font-size:12px;color:var(--text-muted);margin-top:6px">viewer expand</div></div></div><div class="v" style="margin-top:12px">fast 160 · base 280 · slow 600 · scene 900 ms — reduce-motion & mobile: fade only</div></body></html>
